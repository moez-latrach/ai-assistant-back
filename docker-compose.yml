services:

  postgres:

    image: pgvector/pgvector:pg16

    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: userapp
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    # Scripts SQL exécutés à la première création de la base (crée ragdb_demo pour le profil azure)
    volumes:
      - ./docker/init:/docker-entrypoint-initdb.d:ro
