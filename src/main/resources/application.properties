quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=userapp
quarkus.datasource.password=password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/ragdb
# Profil azure : base séparée, documents publics de démonstration uniquement (voir docker/init)
%azure.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/ragdb_demo
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=*
quarkus.hibernate-orm.database.generation=update

# --- RAG : modèles Ollama (local) ---
rag.ollama.base-url=http://localhost:11434
rag.ollama.embedding-model=nomic-embed-text
rag.ollama.chat-model=mistral

# --- RAG : stockage vectoriel pgvector (utilise la datasource Quarkus ci-dessus) ---
rag.pgvector.table=embeddings
# Doit correspondre au modèle d'embedding (nomic-embed-text = 768). Changer de modèle impose une réindexation.
rag.pgvector.dimension=768

# --- RAG : mode d'exécution (affiché au démarrage) ---
# local : documents locaux (y compris confidentiels), base ragdb
# azure : documents publics de démo uniquement, base ragdb_demo  (lancer avec -Dquarkus.profile=azure)
rag.mode=local
%azure.rag.mode=azure
